  <div class="header-right">
    <select class="sort-select" id="sortSelect">
      <option value="name">Sort: Name</option>
      <option value="size">Sort: Size</option>
      <option value="updated">Sort: Last Updated</option>
      <option value="last_used">Sort: Last Used</option>
    </select>
    <input type="text" class="search-box" id="searchBox" placeholder="Search apps...">
    <label class="toggle-label">
      <input type="checkbox" id="hideSystem" checked>
      Hide system apps
    </label>
    <button class="btn-refresh" id="refreshBtn">Refresh</button>
    <button class="btn-analyze" id="analyzeStorageBtn">Analyze Storage</button>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode"></button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="apps" onclick="switchTab('apps')">Applications</button>
  <button class="tab" data-tab="brew" onclick="switchTab('brew')">Homebrew</button>
  <button class="tab" data-tab="npm" onclick="switchTab('npm')">npm</button>
  <button class="tab" data-tab="orphans" onclick="switchTab('orphans')">Orphans</button>
  <button class="tab" data-tab="agents" onclick="switchTab('agents')">Agents</button>
  <span class="tab-count" id="tabCount"></span>
</div>

<div class="main">
  <div class="app-list" id="appList"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">Select an app to view details</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<div id="storageView" class="storage-view hidden">
  <div class="storage-topbar">
    <button class="btn-refresh" id="storageBack">&larr; Back to Sweepr</button>
    <div class="storage-title">Storage Analyzer</div>
    <div class="storage-controls">
      <select class="sort-select" id="storageSort">
        <option value="size">Sort: Size</option>
        <option value="name">Sort: Name</option>
      </select>
      <input type="text" class="search-box" id="storageSearch" placeholder="Filter this folder...">
      <button class="btn-refresh" id="storageRefresh">Refresh</button>
    </div>
  </div>
  <div class="breadcrumb storage-breadcrumb-row" id="storageBreadcrumb"></div>
  <div class="storage-items" id="storageItems"></div>
</div>

<script src="/static/js/utils.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/apps.js"></script>

<script src="/static/js/orphans.js"></script>
<script src="/static/js/agents.js"></script>
<script src="/static/js/storage.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
